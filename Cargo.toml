[package]
name = "openai-api-mcp-server"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
js-sys = "0.3"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
wasm-bindgen = "0.2"
worker = { version = "0.8.7", features = ["d1", "queue"] }
uuid = { version = "1", features = ["v4", "js"] }
hmac = "0.12"
sha2 = "0.10"

[build-dependencies]
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1
